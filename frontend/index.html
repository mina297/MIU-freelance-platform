<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/src/assets/figma/miu-anniversary-logo.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set only the homepage canvas before styles/React load to avoid a light flash.
      if (location.pathname === "/") {
        let preference;
        try {
          preference = localStorage.getItem("miu-homepage-theme");
        } catch {}
        document.documentElement.dataset.homeTheme =
          preference === "dark" || preference === "light"
            ? preference
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      }
    </script>
    <style>
      html[data-home-theme="dark"],
      html[data-home-theme="dark"] body {
        background: #151319;
        color-scheme: dark;
      }
    </style>
    <title>MIU Freelance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
